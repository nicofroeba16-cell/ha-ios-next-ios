name: iOS 27 Mac Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode-27:
    runs-on: xcode-27
    env:
      CI_RUNTIME_SCOPE: full
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Activate pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.14
          cache: false
      - name: Prove Xcode 27 environment
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "27.0"
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "27.0"
          xcrun simctl list devices available | grep -F "iPhone 17 Pro"
          go version
      - name: Start iPhone simulator early
        run: |
          set -euo pipefail
          source Scripts/ci_runtime.sh
          read -r IOSNEXT_IPHONE_UDID IOSNEXT_IPHONE_STATE < <(
            xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); matches=[d for runtime,devices in data["devices"].items() if runtime.endswith("iOS-27-0") for d in devices if d.get("isAvailable", True) and d["name"]=="iPhone 17 Pro"]; assert len(matches)==1, f"expected exactly one iPhone 17 Pro on iOS 27.0, got {len(matches)}"; d=matches[0]; print(d["udid"], d["state"])'
          )
          test -n "$IOSNEXT_IPHONE_UDID"
          echo "IOSNEXT_IPHONE_UDID=$IOSNEXT_IPHONE_UDID" >> "$GITHUB_ENV"
          runtime_start simulator_boot_overlap
          case "$IOSNEXT_IPHONE_STATE" in
            Shutdown)
              xcrun simctl boot "$IOSNEXT_IPHONE_UDID"
              runtime_count simulator_boots
              ;;
            Booted)
              ;;
            *)
              echo "Unexpected simulator state: $IOSNEXT_IPHONE_STATE" >&2
              exit 1
              ;;
          esac
      - name: Portable security and backend tests
        run: bash Scripts/validate_without_macos.sh
      - name: Ensure XcodeGen
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi
      - name: Prepare pinned WireGuard source
        run: bash Scripts/prepare_wireguard_dependency.sh
      - name: Generate project
        run: |
          set -euo pipefail
          xcodegen generate
      - name: Verify pinned WireGuard source
        run: |
          set -euo pipefail
          checkout="$PWD/.build-dependencies/wireguard-apple"
          test "$(git -C "$checkout" rev-parse HEAD)" = "2fec12a6e1f6e3460b6ee483aa00ad29cddadab1"
          expected_status=$' M Package.swift\n M Sources/WireGuardKitC/WireGuardKitC.h'
          test "$(git -C "$checkout" status --short)" = "$expected_status"
          expected_files=$'Package.swift\nSources/WireGuardKitC/WireGuardKitC.h'
          test "$(git -C "$checkout" diff --name-only)" = "$expected_files"
          git -C "$checkout" diff --check
      - name: Build for testing on iOS 27
        run: |
          source Scripts/ci_runtime.sh
          runtime_count xcodebuild_invocations
          runtime_start build_for_testing
          set -o pipefail
          xcodebuild build-for-testing \
            -project IOSNext.xcodeproj \
            -scheme IOSNext \
            -destination "platform=iOS Simulator,id=$IOSNEXT_IPHONE_UDID" \
            | tee xcodebuild.log
          runtime_end build_for_testing

      - name: Verify built packet tunnel metadata
        run: |
          set -euo pipefail
          appex_info="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/IOSNextPacketTunnel.appex/Info.plist' -print -quit)"
          test -f "$appex_info"
          echo "Built extension plist: $appex_info"
          plutil -p "$appex_info"
          test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw -o - "$appex_info")" = "com.apple.networkextension.packet-tunnel"
          test -n "$(plutil -extract NSExtension.NSExtensionPrincipalClass raw -o - "$appex_info")"
          codesign -d --entitlements :- "$(dirname "$appex_info")" 2>&1 | tee packet-tunnel-entitlements.log
          codesign -v "$(dirname "$appex_info")"

      - name: Verify compiled launch screen
        run: |
          set -euo pipefail
          derived="$HOME/Library/Developer/Xcode/DerivedData"
          app_path="$(find "$derived" -type d -path '*/Build/Products/Debug-iphonesimulator/IOSNext.app' -print -quit)"
          partial="$(find "$derived" -type f -name 'LaunchScreen-SBPartialInfo.plist' -print -quit)"
          storyboard="$(find "$app_path" -type d -name 'LaunchScreen.storyboardc' -print -quit)"
          test -d "$app_path"
          test -f "$partial"
          test -d "$storyboard"
          test -f "$app_path/Assets.car"
          plutil -p "$partial" | tee launch-screen-metadata.log
          grep -F "LaunchScreen-SBPartialInfo.plist" xcodebuild.log >/dev/null
          grep -F "CompileStoryboard" xcodebuild.log >/dev/null

      - name: Run unit tests on iOS 27
        run: |
          source Scripts/ci_runtime.sh
          runtime_start simulator_boot_wait
          xcrun simctl bootstatus "$IOSNEXT_IPHONE_UDID" -b
          runtime_end simulator_boot_wait
          runtime_start simulator_instruments_ready
          python3 - "$IOSNEXT_IPHONE_UDID" <<'PY'
          import subprocess
          import sys
          import time

          udid = sys.argv[1]
          deadline = time.monotonic() + 90
          last_output = ""
          while time.monotonic() < deadline:
              try:
                  probe = subprocess.run(
                      ["xcrun", "xctrace", "list", "devices"],
                      capture_output=True,
                      text=True,
                      timeout=20,
                  )
                  last_output = (probe.stdout or "") + (probe.stderr or "")
                  if probe.returncode == 0 and udid in last_output:
                      break
              except subprocess.TimeoutExpired:
                  last_output = "xctrace list devices timed out"
              time.sleep(1)
          else:
              print(last_output, file=sys.stderr)
              raise SystemExit("Simulator never became visible to Instruments")
          PY
          runtime_end simulator_instruments_ready
          runtime_end simulator_boot_overlap
          runtime_count xcodebuild_invocations
          runtime_start unit_tests
          set -o pipefail
          xcodebuild test-without-building \
            -project IOSNext.xcodeproj \
            -scheme IOSNext \
            -destination "platform=iOS Simulator,id=$IOSNEXT_IPHONE_UDID" \
            -only-testing:IOSNextTests \
            -resultBundlePath TestResults.xcresult \
            | tee -a xcodebuild.log
          runtime_end unit_tests
      - name: Run real product UI acceptance matrix
        run: bash Scripts/run_ui_acceptance_matrix.sh
      - name: Capture and validate live HA card catalog
        if: success()
        run: bash Scripts/capture_live_card_screenshots.sh
      - name: Record and validate live interaction acceptance
        if: success()
        run: bash Scripts/run_animation_acceptance.sh
      - name: Render runtime telemetry
        if: always()
        run: |
          source Scripts/ci_runtime.sh
          runtime_render_json ci-runtime-full.json
      - name: Upload Xcode evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-27-xcode-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            xcodebuild.log
            packet-tunnel-entitlements.log
            launch-screen-metadata.log
            TestResults.xcresult
            UITestResults-iPhone.xcresult
            UITestResults-iPad.xcresult
            UIAcceptance
            CardScreenshots
            AnimationAcceptance
            ci-runtime-full.json
