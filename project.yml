name: IOSNext
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1,2"
    PRODUCT_BUNDLE_IDENTIFIER: de.nicofroeba16.iosnext
targets:
  IOSNext:
    type: application
    platform: iOS
    info:
      path: Info.plist
    sources:
      - Sources
      - Assets.xcassets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: iOS Next
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: iOS Next connects to your Home Assistant server on the local network.
        INFOPLIST_KEY_CFBundleURLTypes:
          - CFBundleURLSchemes:
              - iosnext
            CFBundleURLName: de.nicofroeba16.iosnext.auth
  IOSNextTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: IOSNext
